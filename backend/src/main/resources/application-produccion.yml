# Perfil de producción. Lo que aquí falta no se queda en un valor de
# ejemplo: `ComprobacionDeProduccion` impide arrancar, igual que
# `config/produccion.py` en Django.
clinube:
  depuracion: false
logging:
  level:
    root: INFO
server:
  # Detrás del proxy (Nginx o Cloudflare), los enlaces absolutos —los
  # `next`/`previous` de la paginación— tienen que llevar el dominio y el
  # esquema públicos, no los internos. Es lo que en Django hacen
  # SECURE_PROXY_SSL_HEADER y USE_X_FORWARDED_HOST.
  forward-headers-strategy: framework
